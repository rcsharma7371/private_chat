# Coturn TURN Server Configuration for Private 2-Person Chat & Call App
listening-port=3478
tls-listening-port=5349

# Realm matching TURN_REALM in .env
realm=talk.local

# Enable long-term credential mechanism for ephemeral HMAC credentials
lt-cred-mech

# Shared secret matching TURN_SECRET in .env
use-auth-secret
static-auth-secret=super-secure-coturn-shared-secret-must-match-turnserver-conf

# Dynamic UDP relay port range
min-port=49152
max-port=65535

# Fingerprint in TURN messages
fingerprint

# Logging & security settings
verbose
no-cli
no-tls
no-dtls
stale-nonce=600

# Do not allow loopback relays to prevent SSRF
no-loopback-peers
no-multicast-peers
